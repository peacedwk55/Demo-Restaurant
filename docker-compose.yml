version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tableflow-postgres
    environment:
      POSTGRES_DB: tableflow
      POSTGRES_USER: tableflow
      POSTGRES_PASSWORD: tableflow_secret
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tableflow']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tableflow-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: tableflow-api
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://tableflow:tableflow_secret@postgres:5432/tableflow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_production_min_32_chars
      JWT_EXPIRES_IN: 7d
      PORT: 3001
      NODE_ENV: development
      CORS_ORIGINS: http://localhost:3000,http://localhost:3002
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  customer:
    build:
      context: .
      dockerfile: apps/customer/Dockerfile.dev
    container_name: tableflow-customer
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: http://localhost:3001
    volumes:
      - ./apps/customer/src:/app/apps/customer/src
      - ./apps/customer/public:/app/apps/customer/public
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile.dev
    container_name: tableflow-admin
    ports:
      - '3002:3002'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: http://localhost:3001
      PORT: 3002
    volumes:
      - ./apps/admin/src:/app/apps/admin/src
      - ./apps/admin/public:/app/apps/admin/public
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
